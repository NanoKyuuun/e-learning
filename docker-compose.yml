services:
  app:
    build:
      context: ./elearning
      dockerfile: Dockerfile
    container_name: elearning-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      face-api:
        condition: service_started
    env_file:
      - ./elearning/.env
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: elearning
      DB_USERNAME: root
      DB_PASSWORD: root
      QUEUE_CONNECTION: sync
      SESSION_DRIVER: database
      CACHE_STORE: database
      FACE_API_URL: http://face-api:5000
      FACE_API_KEY: demo-secret-key
      FACE_API_TIMEOUT: 30
    ports:
      - "8085:80"
    volumes:
      - ./elearning/storage:/var/www/html/storage
    networks:
      - elearning-network

  face-api:
    build:
      context: ./face_recognition
      dockerfile: Dockerfile
    container_name: elearning-face-api
    restart: unless-stopped
    environment:
      FLASK_PORT: 5000
      FLASK_DEBUG: "False"
      FACE_API_KEY: demo-secret-key
      FACE_THRESHOLD: 0.45
      ALLOWED_ORIGINS: http://localhost:8085,http://127.0.0.1:8085
      MAX_CONTENT_LENGTH: 10485760
    volumes:
      - ./face_recognition/storage:/app/storage
    networks:
      - elearning-network

  db:
    image: mysql:8.0
    container_name: elearning-db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: elearning
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3315:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - elearning-network

networks:
  elearning-network:
    driver: bridge

volumes:
  db-data:
